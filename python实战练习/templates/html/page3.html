<!DOCTYPE html>
<html>

    <title>商品列表 - 第3页</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .products { display: flex; flex-wrap: wrap; }

            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px;
            width: 250px;
            background-color: #f9f9f9;
        }
        .product-image {
            width: 100%;
            height: 150px;
            background-color: #e0e0e0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }
        .name { font-size: 16px; font-weight: bold; margin: 10px 0; }
        .price { color: red; font-size: 18px; margin: 10px 0; }
        .rating { color: orange; margin: 10px 0; }
        a { color: blue; text-decoration: none; }
        .pagination { margin-top: 30px; text-align: center; }
        .end-message { padding: 10px 20px; font-size: 16px; color: #666; }
    </style>
</head>
<body>
